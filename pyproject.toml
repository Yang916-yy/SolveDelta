[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causallsso"
version = "0.1.0"
description = "Causal LSSO: SolveDelta"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.7"]

[project.optional-dependencies]
native = [
    "causal-conv1d>=1.7.0",
    "flash-linear-attention>=0.5.2",
]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["causallsso*"]

[project.urls]
Repository = "https://github.com/Yang916-yy/SolveDelta"

[tool.pytest.ini_options]
testpaths = ["tests"]
